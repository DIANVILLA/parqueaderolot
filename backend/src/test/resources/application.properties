# Configuracion exclusiva para los tests (mvn test). Al estar en src/test/resources, este
# archivo reemplaza por completo al application.properties de src/main/resources cuando se
# corren los tests -- nunca se usa cuando la app corre normalmente (local o en Docker).
#
# @SpringBootTest levanta el contexto completo de Spring, incluyendo el datasource, asi que
# el smoke test (ParqueaderoLotApplicationTests) necesita una base de datos real para poder
# arrancar. En vez de depender de que haya un MySQL corriendo (que no existe en el entorno de
# CI de GitHub Actions), se usa H2: una base de datos que vive solo en memoria RAM durante el
# test y desaparece al terminar -- no requiere instalar ni levantar nada.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# CorreoService necesita un bean JavaMailSender para poder construirse (aunque el test nunca
# envie un correo de verdad) -- sin esta propiedad, Spring ni siquiera crea el bean y falla al
# armar el contexto. El valor no importa, solo que exista.
spring.mail.host=localhost
spring.mail.port=25
