# Cada dato de conexion busca primero una variable de entorno y si no existe cae al valor
# local de siempre — asi el mismo jar corre igual en desarrollo local (sin nada definido) y
# en un contenedor (con las variables que le inyecta docker-compose.yml).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parqueaderolot}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=Debug

# ==========================================
