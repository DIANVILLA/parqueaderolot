server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router maneja las rutas en el navegador (/login, /menu, /admin, ...).
        # Sin esto, recargar la pagina en una de esas rutas daria 404 porque Nginx
        # buscaria un archivo fisico que no existe — en vez de eso, siempre devuelve
        # index.html y deja que React decida que mostrar.
        try_files $uri /index.html;
    }
}
